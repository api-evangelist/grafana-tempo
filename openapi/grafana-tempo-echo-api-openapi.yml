openapi: 3.1.0
info:
  title: Grafana Tempo HTTP Echo API
  description: Grafana Tempo HTTP API for querying traces, searching with TraceQL, and retrieving trace metadata. Tempo is an open-source, high-scale distributed tracing backend.
  version: 2.0.0
  contact:
    name: Grafana Labs
    url: https://grafana.com/oss/tempo/
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: http://localhost:3200
  description: Default Tempo server
tags:
- name: Echo
paths:
  /api/echo:
    get:
      operationId: echo
      summary: Echo endpoint
      description: Health check endpoint that returns a simple response.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Echo
